<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECK TITLE · Subtitle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HTML SLIDE DECK TEMPLATE — fixed 16:9 stage, reading-density house style.
   Replace the example <section class="slide"> blocks with real content.
   Keep :root tokens, the fixed-stage base, controls, @page, and the <script>.
   ============================================================ */
:root{
  --navy:#0e2134; --navy2:#0b1a2a; --navy3:#13304a;
  --cyan:#1ec8e0; --cyan-d:#148aa0;
  --ink:#172430; --ink2:#334153; --muted:#5e6f7e; --faint:#93a2b0;
  --light:#eef2f6; --card:#ffffff; --line:#e3e9ef;
  --teal:#15a3bd; --purple:#5b5be6; --green:#1fa651; --amber:#f5a623; --orange:#f26a1e; --pink:#e81f8c; --blue:#2f8ad6;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#05101c;font-family:var(--sans);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#05101c;}
.deck-stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;}
/* Switch slides with .active — never display:none (a later display:flex can override and show all). */
.slide{position:absolute;inset:0;width:1280px;height:720px;overflow:hidden;background:var(--light);color:var(--ink);
  visibility:hidden;opacity:0;pointer-events:none;}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img{display:block;}
svg.ic{width:1em;height:1em;fill:currentColor;vertical-align:middle;}

.slide.dark{background:var(--navy);color:#fff;}
.circ{position:absolute;border-radius:50%;pointer-events:none;}

/* content-slide header */
.head{position:absolute;left:58px;top:46px;right:58px;}
.ttl{font-size:42px;font-weight:900;color:var(--ink);letter-spacing:-.5px;line-height:1.14;}
.sub{font-size:20.5px;color:var(--cyan-d);font-style:italic;font-weight:500;margin-top:11px;}
.body{position:absolute;left:58px;right:58px;top:156px;bottom:44px;}

/* cards */
.grid{display:grid;gap:22px;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
.card{background:var(--card);border-radius:10px;padding:26px 28px;box-shadow:0 6px 22px rgba(20,45,80,.06);position:relative;}
.card.top{border-top:5px solid var(--c);}
.card.left{border-left:6px solid var(--c);}
.card .ch{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:11px;line-height:1.2;}
.card .ch .cic{color:var(--c);font-size:30px;display:inline-flex;}
.card p{font-size:19px;line-height:1.7;color:var(--muted);}
.card .sm{font-size:17px;}
.icb{width:54px;height:54px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-size:30px;flex:none;}

/* bottom insight bars */
.ins{position:absolute;left:58px;right:58px;bottom:40px;background:var(--navy3);border-left:6px solid var(--amber);
  border-radius:6px;padding:17px 24px;font-size:18px;line-height:1.6;color:#cfe8f0;}
.ins b{color:var(--amber);} .ins .cy{color:var(--cyan);}
.note-l{position:absolute;left:58px;right:58px;bottom:40px;background:#dbeef4;border-radius:6px;padding:16px 24px;
  font-size:18px;line-height:1.6;color:#1d4a5c;}
.note-l b{color:#0f6d86;}
.warn{background:#fdeef1;border-left:5px solid var(--pink);border-radius:6px;padding:16px 22px;font-size:17px;line-height:1.6;color:#7a2a4a;}
.warn b{color:var(--pink);}

/* table */
table.tb{width:100%;border-collapse:collapse;font-size:18px;}
table.tb th{background:var(--navy3);color:#fff;font-weight:700;text-align:left;padding:16px 18px;}
table.tb th:first-child{border-radius:6px 0 0 0;} table.tb th:last-child{border-radius:0 6px 0 0;}
table.tb td{padding:15px 18px;color:var(--ink2);vertical-align:middle;line-height:1.5;border-bottom:1px solid var(--line);}
table.tb tr:nth-child(odd) td{background:#f6f9fb;}
table.tb td b{color:var(--ink);}

/* section divider — keep breathing room between number / title / subtitle */
.sec-num{position:absolute;left:58px;top:206px;font-size:124px;font-weight:300;color:var(--cyan);line-height:.8;letter-spacing:2px;}
.sec-ttl{position:absolute;left:58px;top:356px;font-size:60px;font-weight:900;color:#fff;letter-spacing:-.5px;}
.sec-sub{position:absolute;left:60px;top:456px;font-size:23px;color:#8fa6b4;}
.sec-ic{position:absolute;right:140px;top:50%;transform:translateY(-50%);font-size:150px;color:var(--cyan);}

/* list bullets */
.blist{list-style:none;} .blist li{position:relative;padding-left:24px;margin-bottom:20px;font-size:20px;color:var(--ink2);line-height:1.55;}
.blist li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%;background:var(--c,var(--cyan));}

/* controls */
.pg{position:fixed;right:20px;bottom:16px;z-index:50;font-size:13px;color:#6b8296;letter-spacing:.1em;
  background:rgba(10,25,40,.6);padding:5px 12px;border-radius:20px;}
.pg b{color:var(--cyan);}
.dlbtn{position:fixed;right:20px;top:16px;z-index:50;font-family:var(--sans);font-size:14px;font-weight:700;
  color:#fff;background:var(--cyan-d);border:none;border-radius:22px;padding:9px 18px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:background .2s,transform .2s;}
.dlbtn:hover{background:var(--cyan);transform:translateY(-1px);}
.fsbtn{position:fixed;right:134px;top:16px;z-index:50;font-family:var(--sans);font-size:14px;font-weight:700;
  color:#fff;background:rgba(20,45,70,.55);border:none;border-radius:22px;padding:9px 16px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:background .2s,transform .2s;}
.fsbtn:hover{background:var(--cyan-d);transform:translateY(-1px);}
/* clean presenting view: hide all chrome while fullscreen */
:fullscreen .dlbtn,:fullscreen .fsbtn,:fullscreen .pg,
:-webkit-full-screen .dlbtn,:-webkit-full-screen .fsbtn,:-webkit-full-screen .pg{display:none!important;}

/* force backgrounds to render in Save-as-PDF, and make each slide a clean 16:9 page */
.slide,.circ,[style*="background"]{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
@page{size:1280px 720px;margin:0;}
@media print{
  html,body{width:1280px;height:auto;overflow:visible;background:#fff;}
  .deck-viewport{position:static;overflow:visible;}
  .deck-stage{position:static;width:auto;height:auto;transform:none!important;left:0!important;top:0!important;}
  .slide{position:relative;visibility:visible!important;opacity:1!important;margin:0;page-break-after:always;break-after:page;}
  .slide:last-child{page-break-after:auto;break-after:auto;}
  .pg,.dlbtn,.fsbtn{display:none!important;}
}
</style>
</head>

<button class="fsbtn" id="fs" title="全屏演示（按 F 键切换）">⛶ 全屏</button>
<button class="dlbtn" id="dl" title="导出为 PDF（在弹出的打印窗口中，目标选择「另存为 PDF」）">⬇ 下载 PDF</button>
<div class="pg"><b id="cur">1</b> / <span id="tot">1</span>　←/→ 翻页</div>

<script>
const stage=document.getElementById('stage');
const slides=[...document.querySelectorAll('.slide')];
let idx=0;
document.getElementById('tot').textContent=slides.length;
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;stage.style.left=((innerWidth-1280*s)/2)+'px';stage.style.top=((innerHeight-720*s)/2)+'px';}
function show(i){idx=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,k)=>s.classList.toggle('active',k===idx));document.getElementById('cur').textContent=idx+1;location.hash=idx+1;}
function toggleFS(){const el=document.documentElement;if(!(document.fullscreenElement||document.webkitFullscreenElement)){(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}}
addEventListener('resize',fit);
/* clicker remotes send PageDown/PageUp; also handle arrows, Space, Home/End, and F for fullscreen */
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(idx+1);}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(idx-1);}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key==='f'||e.key==='F'){e.preventDefault();toggleFS();}});
/* click right half = next, left half = prev; ignore clicks on links and control buttons */
addEventListener('click',e=>{if(e.target.closest('a,button,.pg'))return;show(idx+(e.clientX>innerWidth/2?1:-1));});
document.getElementById('dl').addEventListener('click',e=>{e.stopPropagation();window.print();});
document.getElementById('fs').addEventListener('click',e=>{e.stopPropagation();toggleFS();});
const h=parseInt(location.hash.slice(1));fit();show(h>0?h-1:0);
</script>
</body>
</html>
